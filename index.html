<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WhiteNov</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --black: #000000;
      --card: #0b0b0b;
      --white: #ffffff;
      --gray: #888888;
      --border: #292929;
      --glow: rgba(255, 255, 255, 0.15);
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #000000;
      color: white;
    }

    /* LINHAS LATERAIS */

    body::before,
    body::after {
      content: "";

      position: fixed;
      left: 0;

      width: 100%;
      height: 1px;

      background: #ffffff;

      opacity: 0.2;

      box-shadow: 0 0 12px var(--glow);
    }

    body::before {
      top: 8%;
    }

    body::after {
      bottom: 8%;
    }

    /* CARD PRINCIPAL */

    .card {
      width: 100%;
      max-width: 520px;

      padding: 32px;

      background: var(--card);

      border: 1px solid #333333;

      border-radius: 18px;

      box-shadow:
        0 0 25px rgba(255, 255, 255, 0.04),
        0 20px 60px rgba(0, 0, 0, 0.9);

      text-align: center;

      position: relative;
    }

    .card::before,
    .card::after {
      content: "";

      position: absolute;

      left: 35px;
      right: 35px;

      height: 1px;

      background: #ffffff;

      box-shadow: 0 0 12px var(--glow);
    }

    .card::before {
      top: -1px;
    }

    .card::after {
      bottom: -1px;
    }

    /* LOGO */

    .logo {
      margin: 0;

      font-size: 34px;

      font-weight: 800;

      letter-spacing: 2px;

      color: #ffffff;

      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.12);
    }

    .logo span {
      color: #888888;
    }

    /* SLOGAN */

    .slogan {
      margin: 12px 0 26px;

      color: #ffffff;

      font-size: 14px;

      letter-spacing: 1px;

      animation: flutuar 2.8s ease-in-out infinite;

      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.12);
    }

    @keyframes flutuar {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }

    }

    /* SUBTÍTULO */

    .subtitle {
      color: var(--gray);

      font-size: 13px;

      margin-bottom: 24px;
    }

    /* BARRA DE PESQUISA */

    .search-box {
      display: flex;

      gap: 8px;

      width: 100%;
    }

    #appName {
      flex: 1;

      min-width: 0;

      padding: 14px;

      background: #050505;

      border: 1px solid var(--border);

      border-radius: 9px;

      color: white;

      outline: none;

      font-size: 15px;

      transition: 0.2s;
    }

    #appName::placeholder {
      color: #555555;
    }

    #appName:focus {
      border-color: #ffffff;

      box-shadow:
        0 0 10px rgba(255, 255, 255, 0.12);
    }

    /* BOTÃO */

    #searchButton {
      padding: 0 20px;

      border: 1px solid #ffffff;

      border-radius: 9px;

      background: #ffffff;

      color: #000000;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    #searchButton:hover {
      background: #dddddd;

      box-shadow:
        0 0 15px rgba(255, 255, 255, 0.15);
    }

    #searchButton:active {
      transform: scale(0.97);
    }

    /* MENSAGEM */

    .message {
      min-height: 20px;

      margin-top: 18px;

      color: #ffffff;

      font-size: 13px;
    }

    /* RODAPÉ */

    .footer {
      margin-top: 25px;

      color: #444444;

      font-size: 11px;

      letter-spacing: 1px;
    }

    .footer span {
      color: #888888;
    }

    /* CELULAR */

    @media (max-width: 420px) {

      .card {
        padding: 24px 18px;
      }

      .logo {
        font-size: 29px;
      }

      .search-box {
        flex-direction: column;
      }

      #searchButton {
        padding: 13px;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      .slogan {
        animation: none;
      }

    }

  </style>
</head>

<body>

    <div

    function irParaApp() {

      const input = document
        .getElementById("appName")
        .value
        .toLowerCase()
        .trim();

      const message =
        document.getElementById("message");


      if (input === "") {

        message.textContent =
          "Digite o nome de um aplicativo ou site.";

        return;

      }


      if (apps[input]) {

        message.textContent =
          "Abrindo " + input + "...";


        setTimeout(() => {

          window.location.href =
            apps[input];

        }, 300);

        return;

      }


      message.textContent =
        "Não encontrado. Pesquisando na Play Store...";


      setTimeout(() => {

        window.location.href =
          "https://play.google.com/store/search?q=" +
          encodeURIComponent(input) +
          "&c=apps";

      }, 500);

    }


    document
      .getElementById("appName")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          irParaApp();

        }

      });
